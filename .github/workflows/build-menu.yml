# Regenerates the menu in index.html whenever menu.json changes on main,
# and commits the result. Cloudflare then deploys that commit like any other
# push to main.
name: Build menu

on:
  push:
    branches: [main]
    paths:
      - menu.json
      - scripts/build-menu.mjs
  workflow_dispatch:

permissions:
  contents: write # needed to push the regenerated index.html

# Queue runs instead of racing if menu.json is pushed several times quickly.
concurrency:
  group: build-menu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Latest tip of the branch, not the triggering commit, so the push
          # below doesn't get rejected if someone pushed in the meantime.
          ref: ${{ github.ref }}

      - name: Generate menu from menu.json
        run: node scripts/build-menu.mjs

      - name: Commit updated index.html
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already matches menu.json; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update menu in index.html from menu.json" \
                     -m "Generated by scripts/build-menu.mjs for ${GITHUB_SHA::7}."
          git push
